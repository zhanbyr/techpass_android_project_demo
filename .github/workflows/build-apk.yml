name: Build TechPass APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate registry fixture and web modules
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check registry rules and browser scripts
        run: |
          node --check docs/registry/registry-core.js
          node --check docs/registry/registry-ui.js
          node scripts/validate-registry-seed.js
          node scripts/test-registry-core.js

      - name: Install Android SDK packages and accept licenses
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: techpass-technician-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
