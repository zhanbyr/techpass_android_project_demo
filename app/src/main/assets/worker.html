<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TechPass — техник</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#172033;font:15px/1.5 system-ui,sans-serif}header{background:#14233d;color:white;padding:20px}main{max-width:850px;margin:22px auto;padding:0 16px}h1{font-size:22px;margin:0}.panel{background:white;border:1px solid #dce2ea;border-radius:14px;padding:18px;margin-bottom:15px}label{font-size:12px;color:#687386;font-weight:700;display:block;margin:10px 0 5px}input,select{font:inherit;padding:10px;border:1px solid #cbd3df;border-radius:8px;width:100%}button,.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:10px 14px;background:#2059d4;color:white;cursor:pointer;display:inline-block;text-decoration:none}.secondary{background:#e9edf4;color:#26334a}.muted{color:#687386;font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.result{padding:14px;border-radius:10px;background:#f3f5f8;margin-top:12px}.status{padding:5px 9px;border-radius:99px;font-weight:800;font-size:12px}.green{background:#e2f6eb;color:#09663c}.amber{background:#fff2cc;color:#805700}.red{background:#ffebe9;color:#a32118}.hidden{display:none!important}#qr{display:inline-flex;padding:10px;background:white;border:1px solid #dce2ea;border-radius:10px;min-width:220px;min-height:220px;align-items:center;justify-content:center}#reader{max-width:480px;width:100%;margin-top:14px}footer{color:#778195;font-size:12px;text-align:center;padding:15px}</style><body><header><h1>TechPass / приложение техника</h1><a href="index.html" style="color:#d8e4ff">← Назад</a></header><main><div class="panel"><h2>Вход в тестовый профиль</h2><p class="muted">Выберите один из четырёх вымышленных аккаунтов.</p><label>Аккаунт</label><select id="acct"></select><div id="profile" class="result"></div><div class="row"><button onclick="make()">Сгенерировать / обновить QR</button></div></div><div class="panel"><h2>QR для проверки</h2><div id="qr">Выберите профиль</div><p id="tok" class="muted"></p><p class="muted">QR содержит демонстрационный токен и тестовый ID аккаунта, не ИИН или ФИО. Это не защищённый токен для реального применения.</p></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const db=[
{i:'900101300101',n:'Алексей Тестов',c:'ТОО «Тест-Сервис»',r:'СКУД / СВН',s:'Головной офис',u:'2027-03-31',st:'ok',d:'Допуск действителен',lim:'Без дополнительных ограничений'},
{i:'920404300202',n:'Мария Примерова',c:'ТОО «Тест-Сервис»',r:'АПС',s:'Филиал № 0116',u:'2027-03-31',st:'limited',d:'Действителен с ограничениями',lim:'Только АПС и только филиал № 0116'},
{i:'880707300303',n:'Ерлан Демонстрационный',c:'ТОО «Другой подрядчик»',r:'АСПТ',s:'Головной офис',u:'2025-09-30',st:'expired',d:'Срок допуска истёк',lim:'Не допускать до продления'},
{i:'950909300404',n:'Данияр Отозванов',c:'ТОО «Тест-Сервис»',r:'СВН',s:'Головной офис',u:'2027-03-31',st:'revoked',d:'Допуск отозван',lim:'Отозван ответственным'}];
const $=x=>document.getElementById(x);$('acct').innerHTML=db.map((p,i)=>`<option value="${i}">${p.n} — ${p.i}</option>`).join('');
function profile(){let p=db[+$('acct').value];$('profile').innerHTML='<b>'+p.n+'</b><br>'+p.c+'<br><span class="muted">Тестовый ИИН: '+p.i+'<br>Работы: '+p.r+'<br>Объект: '+p.s+'<br>До: '+p.u+'</span><p>'+p.d+'</p><span class="muted">'+p.lim+'</span>'}
function make(){let p=db[+$('acct').value],a=new Uint8Array(16);crypto.getRandomValues(a);let t='TPD-'+Array.from(a).map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();$('qr').innerHTML='';new QRCode($('qr'),{text:JSON.stringify({app:'TechPassDemo',token:t,account:p.i}),width:200,height:200,correctLevel:QRCode.CorrectLevel.H});$('tok').textContent='Демо-токен: '+t;profile()}$('acct').onchange=()=>{profile();make()};profile();make();
</script><footer>Только тестовые данные</footer></body></html>
